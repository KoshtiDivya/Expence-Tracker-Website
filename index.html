<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >
</head>
<body>
    <div class="container">
        <!-- Header -->
         <header class="header">
                    <i class="fa-solid fa-wallet"></i>
                    <h2>Expense Tracker</h2>
         </header>
         <div class="welcome">
            <p>Welcome back!👋</p>
            <h1>Here's your overview</h1>
         </div>

         <!-- Summary card -->
          <section class="cards">
             <div class="card balance">
                <i class="fa-solid fa-wallet"></i>
                <div class="card-data">  
                    <h3>Total Balance</h3>
                    <h1 id="balance">₹0</h1>
                </div>
             </div>
             <div class="card saving">
                <i class="fa-solid fa-piggy-bank"></i>
                <div class="card-data">
                    <h3>Total Saving</h3>
                    <h1 id="saving">₹0</h1>
                </div>
             </div>
             <div class="card expence-total">
                <i class="fa-solid fa-bag-shopping"></i>
                <div class="card-data">
                    <h3>Total Expence</h3>
                    <h1 id="expense-total">₹0</h1>
                </div>
             </div>
          </section>
          <!-- Form -->
          <section class="form-section">
            <h2>Add New Transaction</h2>
            <form action="" id="form-expence">
                <div class="form-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#6149BD" viewBox="0 0 256 256"><path d="M216,64H56a8,8,0,0,1,0-16H192a8,8,0,0,0,0-16H56A24,24,0,0,0,32,56V184a24,24,0,0,0,24,24H216a16,16,0,0,0,16-16V80A16,16,0,0,0,216,64Zm0,128H56a8,8,0,0,1-8-8V78.63A23.84,23.84,0,0,0,56,80H216Zm-48-60a12,12,0,1,1,12,12A12,12,0,0,1,168,132Z"></path></svg>
                    <input
                    id="description"
                    type="text"
                    placeholder="Description"
                    required
                    >
                </div>
                

                <div class="form-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#6149BD" viewBox="0 0 256 256"><path d="M208,80a8,8,0,0,1-8,8H167.85c.09,1.32.15,2.65.15,4a60.07,60.07,0,0,1-60,60H92.69l72.69,66.08a8,8,0,1,1-10.76,11.84l-88-80A8,8,0,0,1,72,136h36a44.05,44.05,0,0,0,44-44c0-1.35-.07-2.68-.19-4H72a8,8,0,0,1,0-16h75.17A44,44,0,0,0,108,48H72a8,8,0,0,1,0-16H200a8,8,0,0,1,0,16H148.74a60.13,60.13,0,0,1,15.82,24H200A8,8,0,0,1,208,80Z"></path></svg>
                    <input
                    id="amount"
                    type="number"
                    placeholder="Amount (₹)"
                    required
                    >
                </div>
                <div class="form-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#6149BD" viewBox="0 0 256 256"><path d="M32,64a8,8,0,0,1,8-8H216a8,8,0,0,1,0,16H40A8,8,0,0,1,32,64Zm104,56H40a8,8,0,0,0,0,16h96a8,8,0,0,0,0-16Zm0,64H40a8,8,0,0,0,0,16h96a8,8,0,0,0,0-16Zm112-24a8,8,0,0,1-3.76,6.78l-64,40A8,8,0,0,1,168,200V120a8,8,0,0,1,12.24-6.78l64,40A8,8,0,0,1,248,160Zm-23.09,0L184,134.43v51.14Z"></path></svg>
                    <select id="type">
                       <option value="income">Income</option>
                       <option value="expence">Expense</option>
                    </select>
                </div>
                
                <div class="form-item add-expence">
                    <button>
                     Add 
                    </button>
                </div>
            </form>
          </section>

          <section class="transaction-section">
            <h2>Transaction History</h2>
              <ul id="transaction-list">
              
              </ul>
          </section>

          <section class="download-section">
            <svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" fill="#ffffff" viewBox="0 0 256 256"><path d="M224,152a8,8,0,0,1-8,8H192v16h16a8,8,0,0,1,0,16H192v16a8,8,0,0,1-16,0V152a8,8,0,0,1,8-8h32A8,8,0,0,1,224,152ZM92,172a28,28,0,0,1-28,28H56v8a8,8,0,0,1-16,0V152a8,8,0,0,1,8-8H64A28,28,0,0,1,92,172Zm-16,0a12,12,0,0,0-12-12H56v24h8A12,12,0,0,0,76,172Zm88,8a36,36,0,0,1-36,36H112a8,8,0,0,1-8-8V152a8,8,0,0,1,8-8h16A36,36,0,0,1,164,180Zm-16,0a20,20,0,0,0-20-20h-8v40h8A20,20,0,0,0,148,180ZM40,112V40A16,16,0,0,1,56,24h96a8,8,0,0,1,5.66,2.34l56,56A8,8,0,0,1,216,88v24a8,8,0,0,1-16,0V96H152a8,8,0,0,1-8-8V40H56v72a8,8,0,0,1-16,0ZM160,80h28.69L160,51.31Z"></path></svg>
            <div>
                <h2>Download Report</h2>
                <p>Download all transaction as PDF</p>
            </div>
            <button id="download-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" fill="#ffffff" viewBox="0 0 256 256"><path d="M224,144v64a8,8,0,0,1-8,8H40a8,8,0,0,1-8-8V144a8,8,0,0,1,16,0v56H208V144a8,8,0,0,1,16,0Zm-101.66,5.66a8,8,0,0,0,11.32,0l40-40a8,8,0,0,0-11.32-11.32L136,124.69V32a8,8,0,0,0-16,0v92.69L93.66,98.34a8,8,0,0,0-11.32,11.32Z"></path></svg>
            </button>
          </section>
    </div>

    <script src="script.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
</body>
</html>
